# Zig-vs-Rust A/B: two identical scribe-bun deployments, one on Bun 1.3.14 (last Zig),
# one on latest (Rust rewrite). Same DB path, pool, and resources — only the runtime binary
# differs. A/B by pointing app-bun's SCRIBE_BASE_URL at scribe-bun-zig vs scribe-bun-rust.
# NOT auto-applied by setup-k3s (subdir is skipped).
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: scribe-bun-zig, namespace: flight-scribe }
spec:
  replicas: 2
  selector: { matchLabels: { app: scribe-bun-zig } }
  template:
    metadata: { labels: { app: scribe-bun-zig } }
    spec:
      containers:
        - name: scribe-bun
          image: scribe-bun-zig:local        # docker build --build-arg BUN_TAG=1.3.14
          imagePullPolicy: IfNotPresent
          env:
            - { name: SCRIBE_APP_MODE, value: production }
            - { name: SCRIBE_APP_PORT, value: "1337" }
            - { name: SCRIBE_APP_DB_HOST, value: pgbouncer }
            - { name: SCRIBE_APP_DB_PORT, value: "5432" }
            - { name: SCRIBE_APP_DB_USER, value: scribe }
            - { name: SCRIBE_APP_DB_PASS, value: scribe }
            - { name: SCRIBE_APP_DB_NAME, value: scribe }
            - { name: SCRIBE_APP_DB_POOL_MAX, value: "250" }
            - { name: SCRIBE_APP_REDIS_HOST, value: redis }
            - { name: SCRIBE_APP_REDIS_PORT, value: "6379" }
            - { name: SCRIBE_APP_REDIS_SCHEMA_DB, value: "1" }
            - { name: SCRIBE_APP_SCHEMA_BASE_URL, value: http://app-bun:3000 }
          ports: [{ containerPort: 1337 }]
          readinessProbe: { httpGet: { path: /, port: 1337 }, initialDelaySeconds: 3, periodSeconds: 5 }
          resources:
            requests: { cpu: "500m", memory: "256Mi" }
            limits: { cpu: "2", memory: "1Gi" }
---
apiVersion: v1
kind: Service
metadata: { name: scribe-bun-zig, namespace: flight-scribe }
spec:
  selector: { app: scribe-bun-zig }
  ports: [{ name: http, port: 1337, targetPort: 1337 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: scribe-bun-rust, namespace: flight-scribe }
spec:
  replicas: 2
  selector: { matchLabels: { app: scribe-bun-rust } }
  template:
    metadata: { labels: { app: scribe-bun-rust } }
    spec:
      containers:
        - name: scribe-bun
          image: scribe-bun-rust:local       # docker build --build-arg BUN_TAG=latest
          imagePullPolicy: IfNotPresent
          env:
            - { name: SCRIBE_APP_MODE, value: production }
            - { name: SCRIBE_APP_PORT, value: "1337" }
            - { name: SCRIBE_APP_DB_HOST, value: pgbouncer }
            - { name: SCRIBE_APP_DB_PORT, value: "5432" }
            - { name: SCRIBE_APP_DB_USER, value: scribe }
            - { name: SCRIBE_APP_DB_PASS, value: scribe }
            - { name: SCRIBE_APP_DB_NAME, value: scribe }
            - { name: SCRIBE_APP_DB_POOL_MAX, value: "250" }
            - { name: SCRIBE_APP_REDIS_HOST, value: redis }
            - { name: SCRIBE_APP_REDIS_PORT, value: "6379" }
            - { name: SCRIBE_APP_REDIS_SCHEMA_DB, value: "1" }
            - { name: SCRIBE_APP_SCHEMA_BASE_URL, value: http://app-bun:3000 }
          ports: [{ containerPort: 1337 }]
          readinessProbe: { httpGet: { path: /, port: 1337 }, initialDelaySeconds: 3, periodSeconds: 5 }
          resources:
            requests: { cpu: "500m", memory: "256Mi" }
            limits: { cpu: "2", memory: "1Gi" }
---
apiVersion: v1
kind: Service
metadata: { name: scribe-bun-rust, namespace: flight-scribe }
spec:
  selector: { app: scribe-bun-rust }
  ports: [{ name: http, port: 1337, targetPort: 1337 }]
