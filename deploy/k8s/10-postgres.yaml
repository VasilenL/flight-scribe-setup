# Postgres — the data store. Single instance (Postgres doesn't scale horizontally
# without replication); persisted on a PVC via k3s's built-in local-path provisioner.
apiVersion: v1
kind: Secret
metadata:
  name: postgres
  namespace: flight-scribe
type: Opaque
stringData:
  POSTGRES_USER: scribe
  POSTGRES_PASSWORD: scribe
  POSTGRES_DB: scribe
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: flight-scribe
spec:
  clusterIP: None           # headless: clients resolve straight to the pod
  selector:
    app: postgres
  ports:
    - name: pg
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: flight-scribe
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          # Postgres tuning baked into args (NOT via `ALTER SYSTEM`, which writes to
          # postgresql.auto.conf inside the PVC and is LOST whenever the volume is recreated by
          # node-churn recovery — that's why the WAL setting kept reverting to 1GB). These -c
          # flags are re-applied on every boot from this manifest, so they're churn-proof.
          #
          # max_connections=1000: let the PgBouncer pool grow (default 100 is too low).
          # synchronous_commit=off: don't block each COMMIT on the WAL fsync (async flush ~200ms).
          #   Multiplies small-write throughput; on a hard crash you lose ≤200ms of commits but the
          #   DB is never corrupted. Fine for a perf cluster.
          # max_wal_size=3GB: raise the WAL-between-checkpoints ceiling well above the default 1GB
          #   so a sustained write bench doesn't trigger a checkpoint storm (which pins Postgres at
          #   ~6 cores re-logging full pages for the SAME inserts). Kept at 3GB — NOT higher —
          #   because the data PVC below is only 5Gi and WAL shares it; a 16GB target would fill
          #   the volume on a long run and PANIC. Bump both together if you enlarge the PVC.
          # checkpoint_timeout=15min + completion_target=0.9: fewer, smoother checkpoints (spread
          #   the I/O over 90% of the interval instead of spiking).
          # shared_buffers=1GB: bigger page cache than the 128MB default; safe inside the 8Gi limit.
          args:
            - "-c"
            - "max_connections=1000"
            - "-c"
            - "synchronous_commit=off"
            - "-c"
            - "max_wal_size=3GB"
            - "-c"
            - "checkpoint_timeout=15min"
            - "-c"
            - "checkpoint_completion_target=0.9"
            - "-c"
            - "shared_buffers=1GB"
          envFrom:
            - secretRef:
                name: postgres
          env:
            # keep PGDATA in a subdir so the volume root can hold lost+found etc.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "scribe"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "scribe"]
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "10"
              memory: "8Gi"   # headroom for up to ~800 pooled backends
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 5Gi
