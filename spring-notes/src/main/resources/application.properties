spring.application.name=notes
server.port=8080

# Java 21 virtual threads — blocking JDBC/JPA scales without a fixed Tomcat thread pool,
# so this is a fair fight vs the async Bun/FastAPI services.
spring.threads.virtual.enabled=true

# Datasource -> PgBouncer (transaction pooling), same path the Bun stack uses.
# prepareThreshold=0 is REQUIRED behind PgBouncer transaction mode: the pgjdbc driver's
# server-side prepared statements otherwise collide across pooled connections.
spring.datasource.url=${DB_URL:jdbc:postgresql://pgbouncer:5432/scribe?prepareThreshold=0}
spring.datasource.username=${DB_USER:scribe}
spring.datasource.password=${DB_PASS:scribe}

# HikariCP — match the other services' pool size for a fair comparison.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:50}
spring.datasource.hikari.minimum-idle=10

# Hibernate: auto-create bench_notes on first run; no open-session-in-view.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Actuator — health probes for k8s + Prometheus metrics for the bench.
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.probes.enabled=true
