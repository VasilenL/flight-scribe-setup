# Runs Scribe (the data tier) as a container instead of a host Node process.
#
# Merge with the base infra file so it joins the same project/network:
#   docker compose -f docker-compose.yml -f docker-compose.scribe.yml up -d
#
# Scribe stays private (published only to 127.0.0.1). It reaches Postgres/Redis
# by service name on the shared compose network, and reaches host-side Flight
# (for schema fetches) via host.docker.internal.
name: flight-scribe-dev

services:
    scribe:
        image: node:20.11-bookworm-slim
        working_dir: /app
        # Bind-mount the source; shadow node_modules + dist with named volumes so
        # the host's (glibc/host-node) artifacts never leak into the container and
        # the container keeps its own compiled output.
        volumes:
            - ../scribe:/app
            - scribe_node_modules:/app/node_modules
            - scribe_dist:/app/dist
        environment:
            SCRIBE_APP_MODE: development
            SCRIBE_APP_PORT: '1337'
            # Postgres/Redis reachable by compose service name on the shared network.
            SCRIBE_APP_DB_HOST: postgres
            SCRIBE_APP_DB_PORT: '5432'
            SCRIBE_APP_DB_USER: scribe
            SCRIBE_APP_DB_PASS: scribe
            SCRIBE_APP_DB_NAME: scribe
            SCRIBE_APP_REDIS_HOST: redis
            SCRIBE_APP_REDIS_PORT: '6379'
            SCRIBE_APP_REDIS_SCHEMA_DB: '1'
            # Flight runs on the host; Scribe fetches component schemas from it.
            SCRIBE_APP_SCHEMA_BASE_URL: http://host.docker.internal:3000
        # Install once (skip if the named volume already has deps), build, run compiled JS.
        command: >
            sh -c "[ -x node_modules/.bin/tsc ] || npm ci;
                   npm run build &&
                   node dist/scribe.cli.js"
        # Keep the data tier private: bind only to localhost on the host.
        ports:
            - '127.0.0.1:1337:1337'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy

volumes:
    scribe_node_modules:
    scribe_dist:
